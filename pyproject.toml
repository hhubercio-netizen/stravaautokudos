[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-autokudos"
version = "0.1.0"
description = "Automatic Strava kudos for a whitelist of athletes"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "loguru>=0.7",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
autokudos = "autokudos.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Typer intentionally uses function calls as argument defaults.
ignore = ["B008"]
